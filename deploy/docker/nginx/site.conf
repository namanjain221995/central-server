# ---------------------------------------------------------------------------
# Everything one HTTPS server block serves, shared by BOTH of them in
# default.conf.template: the LAN address with the local-CA certificate, and the
# public name with a publicly trusted one.
#
# Kept in one file so the two cannot drift. A route added to one name and not
# the other is how an agent ends up working by IP and failing by name.
#
#   /            the dashboard's static build
#   /api/<path>  Admin API on admin-api:5080 as /<path>
#   /agent/...   Agent API on agent-api:5081, unchanged: it already serves
#                /agent/v1 (AgentProtocol.RoutePrefix)
#
# pgAdmin is deliberately NOT proxied here any more. It is a database console
# with a pre-wired schema-owner connection and no MFA, so exposing it on the
# internet-facing origin made one guessed/reused password equal to full control
# of the platform database. It is now reachable only on the box's loopback
# (compose binds 127.0.0.1:5050), i.e. over an SSH tunnel:
#   ssh -L 5050:127.0.0.1:5050 ec2-user@<host>   then  http://localhost:5050/
#
# No ${VARIABLES} here, deliberately: this file is copied as-is rather than
# rendered, so everything that starts with $ below is an nginx runtime variable.
# ---------------------------------------------------------------------------

server_tokens off;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;

root /usr/share/nginx/html;
index index.html;

# Small by default: the big limit exists for package/release uploads, which
# all travel through /api/ — granting it to every path (including the
# unauthenticated ones) let anyone stream huge bodies at the login and
# enrollment routes and fill the disk via nginx's request buffering.
client_max_body_size 2m;

# Docker's embedded DNS, and every upstream named through a VARIABLE.
# A literal host name in proxy_pass is resolved once, while nginx parses its
# configuration: one upstream container that is not up yet then takes the
# whole entry point down with "host not found in upstream", and a container
# that is later recreated on a new address is never re-resolved. Through a
# variable, resolution happens per request, so a restarting service costs a
# 502 on its own path and nothing else.
resolver 127.0.0.11 valid=10s ipv6=off;

# Container-local, for the healthcheck only.
location = /healthz {
    access_log off;
    return 200 "ok\n";
}

location /api/ {
    # The dashboard calls /api/<path>; the API serves /<path>. The rewrite
    # is what strips the prefix (proxy_pass cannot do it for a variable
    # upstream), mirroring the Vite dev proxy - which is why one frontend
    # build works in both places.
    set $admin_api http://admin-api:5080;

    # Package, driver and agent-release uploads ride this prefix; everything
    # else on the server keeps the small default above.
    client_max_body_size 512m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $admin_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ON, deliberately, for the admin API alone: package and release uploads
    # are hundreds of megabytes over a browser's HTTP/2 connection, whose
    # 64 KB flow-control window makes an unbuffered upload crawl at the RTT
    # (~300 KB/s from the office to us-east-1 — minutes for one MSI, and the
    # browser gives up). Buffered, nginx takes the body at line speed into a
    # temp file and replays it to Kestrel over the container network. The
    # agent location below stays unbuffered: its bodies are small JSON over
    # HTTP/1.1, which has no such window.
    proxy_request_buffering on;
    proxy_buffering         off;
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

location /agent/ {
    # No prefix rewrite: the Agent API already serves these paths at
    # /agent/v1 (AgentProtocol.RoutePrefix).
    set $agent_api http://agent-api:5081;

    # Device traffic is JSON (heartbeats, inventory, task results) — roomy
    # enough for the largest inventory report, nowhere near upload-sized.
    client_max_body_size 16m;
    proxy_pass $agent_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Single-page app: unknown paths are client-side routes, not 404s.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Containment for any future XSS in the SPA. script-src stays strict
    # ('self', no inline) — the built index.html loads only external module
    # scripts. style-src needs 'unsafe-inline' for the theme bootstrap
    # <style> block and React's style attributes; img-src allows data: for
    # generated images. The MFA QR is inline SVG markup, not a fetch, so it
    # needs nothing here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
