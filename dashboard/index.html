<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The administrator's theme is applied before anything paints:
         theme-init.js sets <html data-theme> from the browser's copy of the
         preference, and the canvas below matches it, so there is no flash of the
         other theme while the stylesheet and the account preference load. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <title>Endpoint Platform</title>
    <script src="/theme-init.js"></script>
    <style>
      html { background: #0b1220; }
      html[data-theme='light'] { background: #f3f5f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
